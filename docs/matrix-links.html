<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Matrix Links</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23000'/%3E%3Ccircle cx='256' cy='262' r='172' fill='%23001a08' stroke='%2300ff55' stroke-width='26'/%3E%3Cg transform='translate(262 262) scale(3.5) translate(-54.5 -52.5)'%3E%3Cpath fill='%23d4ffd4' d='M84,26 L24,50 C21.5,51 21.7,54.4 24.3,55.2 L38,59.4 L44,77.5 C44.8,79.9 47.9,80.3 49.4,78.2 L56.6,68.4 L68.5,77.3 C70.7,78.9 73.8,77.7 74.4,75.1 L86.8,29.6 C87.4,27.2 85.6,25.1 84,26 Z'/%3E%3C/g%3E%3Ccircle cx='392' cy='128' r='56' fill='%2300ff55' stroke='%23000' stroke-width='12'/%3E%3Cpath d='M377 104 L413 128 L377 152 Z' fill='%23000'/%3E%3C/svg%3E">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  background: #000;
  overflow: hidden;
  user-select: none;
  position: fixed;
  inset: 0;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}
canvas { display: block; width: 100%; height: 100%; }
.scanlines {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px, transparent 2px,
    rgba(0, 0, 0, 0.18) 2px, rgba(0, 0, 0, 0.18) 4px
  );
}
#oracle-wrap {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
  pointer-events: none;
}
#oracle-wrap::before {
  content: "";
  position: absolute;
  width: 80%;
  height: 40%;
  background: radial-gradient(ellipse, rgba(0,0,0,0.72) 0%, transparent 70%);
}
#oracle {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 0.12em;
  font-family: "Courier New", Consolas, "Lucida Console", monospace;
  font-size: clamp(29px, 7.7vw, 92px);
  font-weight: 700;
  letter-spacing: 0.12em;
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
  pointer-events: auto;
  text-align: center;
}
#oracle.inactive { pointer-events: none; cursor: default; }
#oracle span {
  display: inline-block;
  min-width: 0.7em;
  text-align: center;
  color: #00c83a;
  text-shadow: 0 0 6px #00ff55;
  opacity: 0;
  will-change: transform, opacity, color;
  transition: color 0.2s, text-shadow 0.2s, opacity 0.18s, transform 0.18s;
}
#oracle span.show { opacity: 1; }
#oracle span.locked {
  color: #d4ffd4;
  text-shadow: 0 0 4px #fff, 0 0 8px #6f6, 0 0 18px #0f0, 0 0 36px #0a0, 0 0 72px #050;
}
#oracle.done { animation: pulse 2.8s ease-in-out infinite; }
#oracle.done:hover span.locked {
  color: #ffffff;
  text-shadow: 0 0 5px #fff, 0 0 12px #9f9, 0 0 28px #0f0, 0 0 55px #0f0;
}
#oracle.onedopea-mode { animation: glitch-skew 0.4s infinite linear alternate-reverse; }
#oracle.onedopea-mode span { text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff; }
#oracle.onedopea-mode span.locked {
  color: #fff;
  text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff, 0 0 10px #0f0, 0 0 20px #0f0, 0 0 40px #0f0;
  animation: glitch-anim 0.15s infinite;
}

#bottom-btn {
  position: fixed;
  bottom: 8vh;
  left: 50%;
  width: 120px;
  height: 44px;
  border: 1px solid #0f0;
  background: rgba(0, 255, 0, 0.03);
  z-index: 6;
  pointer-events: auto;
  display: none;
  text-decoration: none;
  box-shadow: 0 0 10px rgba(0, 255, 0, 0.3), inset 0 0 10px rgba(0, 255, 0, 0.1);
  overflow: visible;
  animation: btnFlicker 3s infinite;
  transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
              width 0.15s ease,
              height 0.15s ease,
              border-radius 0.15s ease;
}
#bottom-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 255, 0, 0.15) 0px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
}
#bottom-btn span {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  font-family: "Courier New", monospace;
  color: #0f0;
  font-size: 16px;
  letter-spacing: 2px;
  text-shadow: 0 0 5px #0f0;
  pointer-events: none;
}
#bottom-btn.collapsing {
  transition: all 1.2s cubic-bezier(0.8, 0, 1, 0.2) !important;
  bottom: auto !important;
  top: 50% !important;
  left: 50% !important;
  width: 6px !important;
  height: 2px !important;
  transform: translate(-50%, -50%) scale(0.5) !important;
  opacity: 0 !important;
  pointer-events: none !important;
}

@keyframes btnFlicker {
  0%, 100% { opacity: 1; border-color: #0f0; }
  48% { opacity: 1; }
  50% { opacity: 0.3; border-color: #050; }
  52% { opacity: 1; }
}

#typing-el {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: "Courier New", Consolas, "Lucida Console", monospace;
  font-size: clamp(18px, 4vw, 28px);
  color: #0f0;
  text-shadow: 0 0 6px #0f0;
  z-index: 6;
  pointer-events: none;
  white-space: pre;
  display: flex;
  gap: 0;
  flex-wrap: wrap;
  justify-content: center;
}
#typing-el span {
  display: inline-block;
  min-width: 0.6em;
  text-align: center;
  opacity: 0;
  transition: opacity 0.3s, color 0.2s;
}

@keyframes pulse {
  0%, 100% { filter: brightness(1) drop-shadow(0 0 8px #0f0); }
  50% { filter: brightness(1.35) drop-shadow(0 0 22px #0f0); }
}
@keyframes glitch-anim {
  0% { transform: translate(0); }
  20% { transform: translate(-3px, 2px); }
  40% { transform: translate(3px, -2px); }
  60% { transform: translate(-2px, 3px); }
  80% { transform: translate(2px, -3px); }
  100% { transform: translate(0); }
}
@keyframes glitch-skew {
  0% { transform: skew(0deg); }
  20% { transform: skew(-3deg); }
  40% { transform: skew(3deg); }
  60% { transform: skew(-1deg); }
  80% { transform: skew(1deg); }
  100% { transform: skew(0deg); }
}
/* ---------- логотип BotControl: появляется в цикле вместе с «BotControl App» ---------- */
.bc-logo {
  flex: 0 0 100%;
  display: flex;
  justify-content: center;
  margin-bottom: 0.18em;
  opacity: 0;
  color: #00c83a;
  pointer-events: none;
}
.bc-logo svg {
  width: clamp(64px, 1.75em, 170px);
  height: clamp(64px, 1.75em, 170px);
  overflow: visible;
  filter: drop-shadow(0 0 6px #00ff55);
  transition: filter 0.35s;
}
.bc-logo .l-tile  { fill: rgba(0, 40, 12, 0.55); stroke: currentColor; stroke-width: 8; }
.bc-logo .l-disc  { fill: rgba(0, 255, 85, 0.07); stroke: currentColor; stroke-width: 10; }
.bc-logo .l-trail { fill: none; stroke: currentColor; stroke-width: 15; stroke-linecap: round; stroke-dasharray: 1 34; }
.bc-logo .l-plane { fill: currentColor; stroke: currentColor; stroke-width: 1.2; stroke-linejoin: round; }
.bc-logo .l-fold  { fill: #000; fill-opacity: 0.4; }
.bc-logo .l-badge { fill: #000; stroke: currentColor; stroke-width: 10; }
.bc-logo .l-play  { fill: currentColor; stroke: currentColor; stroke-width: 6; stroke-linejoin: round; }
.bc-logo * { transition: fill 0.35s, stroke 0.35s, fill-opacity 0.35s, color 0.2s; }
/* расшифровка: как буквы — рябь глифов → зафиксировано */
.bc-logo.show { opacity: 1; animation: logo-decode 0.76s steps(1, end) both; }
.bc-logo.locked { color: #d4ffd4; }
.bc-logo.locked svg { filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px #0f0) drop-shadow(0 0 26px #0a0); }
.bc-logo.glitch svg { animation: glitch-anim 0.15s 1; }
.bc-logo.glitch { color: #9f9; }
/* «сигнал» приложения: на миг логотип в настоящих цветах BotControl */
.bc-logo.true-color .l-tile  { fill: #17212B; stroke: #33475A; }
.bc-logo.true-color .l-disc  { fill: #2B5278; stroke: #5288C1; }
.bc-logo.true-color .l-trail { stroke: #FBBF24; }
.bc-logo.true-color .l-plane { fill: #F5F6F7; stroke: #F5F6F7; }
.bc-logo.true-color .l-fold  { fill: #C9D7E6; fill-opacity: 1; }
.bc-logo.true-color .l-badge { fill: #FBBF24; stroke: #0E1621; }
.bc-logo.true-color .l-play  { fill: #0E1621; stroke: #0E1621; }
.bc-logo.true-color svg { filter: drop-shadow(0 0 10px rgba(82, 136, 193, 0.9)) drop-shadow(0 0 30px rgba(43, 82, 120, 0.8)); }
#oracle.done:hover .bc-logo .l-tile  { fill: #17212B; stroke: #33475A; }
#oracle.done:hover .bc-logo .l-disc  { fill: #2B5278; stroke: #5288C1; }
#oracle.done:hover .bc-logo .l-trail { stroke: #FBBF24; }
#oracle.done:hover .bc-logo .l-plane { fill: #F5F6F7; stroke: #F5F6F7; }
#oracle.done:hover .bc-logo .l-fold  { fill: #C9D7E6; fill-opacity: 1; }
#oracle.done:hover .bc-logo .l-badge { fill: #FBBF24; stroke: #0E1621; }
#oracle.done:hover .bc-logo .l-play  { fill: #0E1621; stroke: #0E1621; }
.bc-logo.out { animation: logo-out 0.68s steps(1, end) forwards; }
@keyframes logo-decode {
  0%   { opacity: 0.2; clip-path: inset(0 0 78% 0); transform: translateX(-6px); }
  12%  { opacity: 0.9; clip-path: inset(40% 0 35% 0); transform: translateX(5px); }
  25%  { opacity: 0.4; clip-path: inset(0 0 55% 0); transform: translateX(-3px); }
  38%  { opacity: 1;   clip-path: inset(62% 0 0 0); transform: translateX(4px); }
  52%  { opacity: 0.6; clip-path: inset(0 0 30% 0); transform: translateX(-2px); }
  66%  { opacity: 1;   clip-path: inset(20% 0 10% 0); transform: translateX(2px); }
  82%  { opacity: 0.8; clip-path: inset(0 0 8% 0); transform: translateX(-1px); }
  100% { opacity: 1;   clip-path: inset(0 0 0 0); transform: none; }
}
@keyframes logo-out {
  0%   { opacity: 1;   clip-path: inset(0 0 0 0); transform: none; }
  20%  { opacity: 0.7; clip-path: inset(0 0 25% 0); transform: translateX(4px); }
  40%  { opacity: 0.9; clip-path: inset(35% 0 20% 0); transform: translateX(-5px); }
  60%  { opacity: 0.4; clip-path: inset(0 0 60% 0); transform: translateX(3px); }
  80%  { opacity: 0.2; clip-path: inset(70% 0 0 0); transform: translateX(-2px); }
  100% { opacity: 0;   clip-path: inset(0 0 100% 0); transform: none; }
}

/* ---------- кнопка GitHub: надёжная (не убегает), в стиле терминала ---------- */
#gh-btn {
  position: fixed;
  top: max(14px, env(safe-area-inset-top));
  right: max(14px, env(safe-area-inset-right));
  z-index: 11;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 14px;
  border: 1px solid #0f0;
  background: rgba(0, 255, 0, 0.04);
  box-shadow: 0 0 10px rgba(0, 255, 0, 0.3), inset 0 0 10px rgba(0, 255, 0, 0.1);
  font-family: "Courier New", monospace;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #0f0;
  text-shadow: 0 0 5px #0f0;
  text-decoration: none;
  pointer-events: auto;
  opacity: 0;
  transform: translateY(-8px);
  transition: opacity 0.4s, transform 0.4s, color 0.2s, background 0.2s, box-shadow 0.2s;
  animation: btnFlicker 4.2s infinite;
}
#gh-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0, 255, 0, 0.12) 0px, transparent 1px, transparent 3px);
  pointer-events: none;
}
#gh-btn svg { width: 18px; height: 18px; fill: currentColor; filter: drop-shadow(0 0 4px #0f0); flex: none; }
#gh-btn span { position: relative; white-space: pre; }
#gh-btn.show { opacity: 1; transform: none; }
#gh-btn:hover, #gh-btn:focus-visible {
  color: #d4ffd4;
  background: rgba(0, 255, 0, 0.12);
  box-shadow: 0 0 18px rgba(0, 255, 0, 0.6), inset 0 0 14px rgba(0, 255, 0, 0.25);
  outline: none;
}
/* пока в цикле «BotControl App» — кнопка подсвечена: это его исходники */
#gh-btn.hot {
  color: #d4ffd4;
  border-color: #9f9;
  box-shadow: 0 0 16px rgba(0, 255, 0, 0.55), 0 0 36px rgba(0, 160, 0, 0.35), inset 0 0 12px rgba(0, 255, 0, 0.2);
}
#gh-btn.collapsing {
  transition: all 1.2s cubic-bezier(0.8, 0, 1, 0.2) !important;
  top: 50% !important;
  right: 50% !important;
  transform: translate(50%, -50%) scale(0.2) !important;
  opacity: 0 !important;
  pointer-events: none !important;
}
@media (max-width: 420px) {
  #gh-btn { height: 36px; padding: 0 10px; font-size: 13px; letter-spacing: 1px; }
}

#tv-effect {
  position: fixed;
  inset: 0;
  background: #fff;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transform-origin: center center;
}
#tv-effect.active {
  animation: tvTurnOff 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
}
@keyframes tvTurnOff {
  0% { opacity: 1; transform: scaleY(1) scaleX(1); filter: brightness(1); }
  20% { opacity: 1; transform: scaleY(0.005) scaleX(1); filter: brightness(5); }
  100% { opacity: 0; transform: scaleY(0.005) scaleX(0.005); filter: brightness(0); }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="oracle-wrap">
  <a id="oracle" class="inactive" href="#" target="_blank" rel="noopener noreferrer"></a>
</div>
<a id="bottom-btn" href="#" target="_blank" rel="noopener noreferrer"><span id="btn-text"></span></a>
<a id="gh-btn" href="https://github.com/visiontripin/oracle" target="_blank" rel="noopener noreferrer"
   title="GitHub → visiontripin/oracle" aria-label="GitHub: исходники BotControl (visiontripin/oracle)">
  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
  <span id="gh-text">GITHUB</span>
</a>
<div id="typing-el"></div>
<div class="scanlines"></div>
<div id="tv-effect"></div>

<script>
const C = document.getElementById('c');
const X = C.getContext('2d', { alpha: false });
const oracleEl = document.getElementById('oracle');
const typingEl = document.getElementById('typing-el');
const bottomBtn = document.getElementById('bottom-btn');
const btnText = document.getElementById('btn-text');
const ghBtn = document.getElementById('gh-btn');
const ghText = document.getElementById('gh-text');

const GLYPHS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const S = 18;
const N = 10;
const MAX_CRUMBS = 300;
let drops = [];
let crumbs = [];
let maxDrops = 40;
let rainActive = true;
let collapseStart = 0;
let cycleFallMultiplier = 1.0;

const TITLES = [
  { word: 'ORACLE', url: 'https://t.me/OneDope_bot' },
  { word: 'DAROMVPL', url: 'https://t.me/daromvpl' },
  { word: 'BotControl\nApp', url: 'https://t.me/AppBotcontrol_bot' }
];
const SPECIAL_TITLE = { word: 'ONEDOPEA', url: 'https://t.me/onedopea' };

// Логотип BotControl (геометрия — tg-bot-control/branding/logo.svg), в неоновом стиле страницы.
// Показывается над «BotControl App» и живёт по тем же фазам цикла, что и буквы.
const BOTCONTROL_INDEX = TITLES.findIndex(t => t.url.indexOf('AppBotcontrol_bot') !== -1);
const LOGO_SVG =
  '<svg viewBox="0 0 512 512" aria-hidden="true">' +
  '<rect class="l-tile" x="8" y="8" width="496" height="496" rx="108"/>' +
  '<circle class="l-disc" cx="256" cy="262" r="178"/>' +
  '<path class="l-trail" d="M104 402 Q 150 352 212 336"/>' +
  '<g transform="translate(262 262) scale(3.5) translate(-54.5 -52.5)">' +
  '<path class="l-plane" d="M84,26 L24,50 C21.5,51 21.7,54.4 24.3,55.2 L38,59.4 L44,77.5 C44.8,79.9 47.9,80.3 49.4,78.2 L56.6,68.4 L68.5,77.3 C70.7,78.9 73.8,77.7 74.4,75.1 L86.8,29.6 C87.4,27.2 85.6,25.1 84,26 Z"/>' +
  '<path class="l-fold" d="M38,59.4 L72,36 L48.5,66.5 L44,77.5 Z"/>' +
  '</g>' +
  '<circle class="l-badge" cx="392" cy="128" r="50"/>' +
  '<path class="l-play" d="M377 104 L413 128 L377 152 Z"/>' +
  '</svg>';
const GH_LABEL = 'GITHUB';
let logoEl = null;
let ghDecodeTimer = null;

const START_DELAY = 1400;
const LETTER_STEP = 230;
const APPEAR_SCRAMBLE_TIME = 760;
const DISAPPEAR_SCRAMBLE_TIME = 680;
const HOLD_TIME = 3600;
const BETWEEN_WORDS_TIME = 650;
const MAX_CYCLES_BEFORE_TV = 1;

let currentTitleIndex = 0;
let pendingTitleIndex = 0;
let completedCycles = 0;
let letters = [];
let titlePhase = 'appearing';
let phaseStart = performance.now() + START_DELAY;

const TYPING_STRING = "............wake up, Neo!";
let typingSpans = [];
let typingState = 'idle';
let typingStartTime = 0;
let currentTypingIndex = 0;

let btnGlitchInterval = null;
let btnRespawnTimeout = null;

let btnOffsetX = 0;
let btnOffsetY = 0;
let btnEscaping = false;
let btnEscapeCooldown = false;
let mouseX = -9999;
let mouseY = -9999;

function randomGlyph() {
  return GLYPHS[(Math.random() * GLYPHS.length) | 0];
}

function getSafeZone() {
  const rect = oracleEl.getBoundingClientRect();
  if (rect.width > 0 && rect.height > 0) {
    const padding = 30;
    return {
      x: rect.left - padding,
      y: rect.top - padding,
      w: rect.width + padding * 2,
      h: rect.height + padding * 2
    };
  }
  const w = Math.min(C.width * 0.85, 800);
  const h = C.height * 0.30;
  return { x: (C.width - w) / 2, y: (C.height - h) / 2, w, h };
}

function shatterButton() {
  const rect = bottomBtn.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  for (let i = 0; i < 25; i++) {
    crumbs.push({
      x: cx + (Math.random() - 0.5) * rect.width,
      y: cy + (Math.random() - 0.5) * rect.height,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.5) * 10 - 2,
      life: 1,
      decay: 0.015 + Math.random() * 0.02,
      w: 2 + Math.random() * 6,
      h: 2 + Math.random() * 6,
      isChar: Math.random() < 0.5,
      ch: randomGlyph(),
      chSize: S * (0.3 + Math.random() * 0.6),
      rot: (Math.random() - 0.5) * 6,
      rotV: (Math.random() - 0.5) * 0.4,
      collapsing: false
    });
  }

  bottomBtn.style.display = 'none';
  btnEscaping = false;

  if (btnRespawnTimeout) clearTimeout(btnRespawnTimeout);
  btnRespawnTimeout = setTimeout(() => {
    if (currentTitleIndex !== -1 && titlePhase !== 'tv_collapse' && titlePhase !== 'tv_off') {
      btnOffsetX = 0;
      btnOffsetY = 0;
      bottomBtn.style.display = 'block';
      bottomBtn.style.transform = 'translateX(-50%)';
    }
  }, 2000);
}

function checkButtonCollision() {
  if (bottomBtn.style.display === 'none' || currentTitleIndex === -1) return;
  const btnRect = bottomBtn.getBoundingClientRect();
  const titleRect = oracleEl.getBoundingClientRect();
  if (btnRect.left < titleRect.right &&
      btnRect.right > titleRect.left &&
      btnRect.top < titleRect.bottom &&
      btnRect.bottom > titleRect.top) {
    shatterButton();
  }
}

function applyBtnTransform() {
  bottomBtn.style.transform = `translate(calc(-50% + ${btnOffsetX}px), ${btnOffsetY}px)`;
}

function escapeButton() {
  if (btnEscaping || btnEscapeCooldown) return;
  btnEscaping = true;

  if (btnGlitchInterval) { clearInterval(btnGlitchInterval); btnGlitchInterval = null; }

  const rect = bottomBtn.getBoundingClientRect();
  const btnCX = rect.left + rect.width / 2;
  const btnCY = rect.top + rect.height / 2;
  let dx = btnCX - mouseX;
  let dy = btnCY - mouseY;
  const dist = Math.hypot(dx, dy) || 1;
  dx /= dist;
  dy /= dist;

  const angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 1.2;
  const escapeDist = 100 + Math.random() * 300;

  btnOffsetX += Math.cos(angle) * escapeDist;
  btnOffsetY += Math.sin(angle) * escapeDist;

  const maxOff = Math.max(C.width, C.height) * 0.4;
  btnOffsetX = Math.max(-maxOff, Math.min(maxOff, btnOffsetX));
  btnOffsetY = Math.max(-maxOff, Math.min(maxOff, btnOffsetY));

  applyBtnTransform();
  setTimeout(checkButtonCollision, 400);

  btnEscapeCooldown = true;
  setTimeout(() => {
    btnEscaping = false;
    btnEscapeCooldown = false;
    if (bottomBtn.style.display !== 'none' && !bottomBtn.classList.contains('collapsing')) {
      startBtnGlitch();
    }
  }, 600);
}

document.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

function checkMouseProximity() {
  if (bottomBtn.style.display === 'none' || btnEscaping || btnEscapeCooldown) return;
  if (currentTitleIndex === -1) return;

  const rect = bottomBtn.getBoundingClientRect();
  const btnCX = rect.left + rect.width / 2;
  const btnCY = rect.top + rect.height / 2;
  const dist = Math.hypot(mouseX - btnCX, mouseY - btnCY);

  if (dist < 80) {
    escapeButton();
  }
}

function startBtnGlitch() {
  if (btnGlitchInterval) clearInterval(btnGlitchInterval);
  btnGlitchInterval = setInterval(() => {
    if (bottomBtn.classList.contains('collapsing') || btnEscaping) return;

    const w = 40 + Math.random() * 160;
    const h = 20 + Math.random() * 60;
    const borderRadius = Math.random() < 0.3 ? (5 + Math.random() * 20) + 'px' : '0';

    bottomBtn.style.width = w + 'px';
    bottomBtn.style.height = h + 'px';
    bottomBtn.style.borderRadius = borderRadius;

    let txt = '';
    const len = 3 + Math.floor(Math.random() * 8);
    for (let i = 0; i < len; i++) txt += randomGlyph();
    btnText.textContent = txt;

    const jitterX = (Math.random() > 0.5 ? 1 : -1) * Math.random() * 100;
    const jitterY = (Math.random() > 0.5 ? 1 : -1) * Math.random() * 100;
    btnOffsetX += jitterX;
    btnOffsetY += jitterY;

    const maxOff = Math.max(C.width, C.height) * 0.4;
    btnOffsetX = Math.max(-maxOff, Math.min(maxOff, btnOffsetX));
    btnOffsetY = Math.max(-maxOff, Math.min(maxOff, btnOffsetY));

    applyBtnTransform();
    setTimeout(checkButtonCollision, 400);
  }, 150);
}

function updateBottomBtn(index) {
  if (btnGlitchInterval) { clearInterval(btnGlitchInterval); btnGlitchInterval = null; }
  if (btnRespawnTimeout) { clearTimeout(btnRespawnTimeout); btnRespawnTimeout = null; }

  btnOffsetX = 0;
  btnOffsetY = 0;
  btnEscaping = false;
  btnEscapeCooldown = false;

  if (index === -1) {
    bottomBtn.style.display = 'none';
  } else {
    bottomBtn.style.display = 'block';
    bottomBtn.href = TITLES[index].url;
    bottomBtn.classList.remove('collapsing');
    bottomBtn.style.width = '120px';
    bottomBtn.style.height = '44px';
    bottomBtn.style.borderRadius = '0';
    bottomBtn.style.transform = 'translateX(-50%)';
    startBtnGlitch();
  }
}

// Надпись кнопки GitHub расшифровывается из глифов, как заголовки.
function decodeGhLabel() {
  if (ghDecodeTimer) clearInterval(ghDecodeTimer);
  let step = 0;
  ghDecodeTimer = setInterval(() => {
    step++;
    const locked = Math.floor(step / 3);
    let txt = '';
    for (let i = 0; i < GH_LABEL.length; i++) txt += i < locked ? GH_LABEL[i] : randomGlyph();
    ghText.textContent = txt;
    if (locked >= GH_LABEL.length) { clearInterval(ghDecodeTimer); ghDecodeTimer = null; ghText.textContent = GH_LABEL; }
  }, 45);
}

function showGhBtn(hot) {
  const wasHidden = !ghBtn.classList.contains('show') || ghBtn.classList.contains('collapsing');
  ghBtn.classList.remove('collapsing');
  ghBtn.classList.add('show');
  ghBtn.classList.toggle('hot', !!hot);
  if (wasHidden || hot) decodeGhLabel();
}

function hideGhBtn() {
  ghBtn.classList.remove('show', 'hot');
}

function setupTitle(index, startAt = performance.now()) {
  currentTitleIndex = index;
  const item = index === -1 ? SPECIAL_TITLE : TITLES[index];
  oracleEl.href = item.url;
  oracleEl.title = item.word.replace('\n', ' ') + ' → ' + item.url;
  oracleEl.setAttribute('aria-label', item.word.replace('\n', ' ') + ' Telegram link');
  oracleEl.classList.remove('done');
  if (index === -1) {
    oracleEl.classList.add('inactive', 'onedopea-mode');
  } else {
    oracleEl.classList.remove('onedopea-mode');
    oracleEl.classList.add('inactive');
  }
  oracleEl.innerHTML = '';

  // логотип — первым рядом внутри ссылки (кликабелен, входит в safe zone)
  logoEl = null;
  if (index === BOTCONTROL_INDEX) {
    logoEl = document.createElement('div');
    logoEl.className = 'bc-logo';
    logoEl.innerHTML = LOGO_SVG;
    oracleEl.appendChild(logoEl);
  }

  letters = item.word.split('').map(ch => {
    const span = document.createElement('span');
    if (ch === '\n') {
      span.style.display = 'block';
      span.style.width = '100%';
      span.style.height = '0.5em';
      span.dataset.locked = '1';
      span.dataset.hidden = '1';
      span.classList.add('show');
    } else {
      span.dataset.target = ch;
      span.dataset.locked = '0';
      span.dataset.hidden = '0';
      span.textContent = '';
    }
    oracleEl.appendChild(span);
    return span;
  });

  titlePhase = 'appearing';
  phaseStart = startAt;
  updateBottomBtn(index);
  if (index === BOTCONTROL_INDEX) showGhBtn(true);
  else if (ghBtn.classList.contains('hot')) ghBtn.classList.remove('hot');
}

setupTitle(0, performance.now() + START_DELAY);
setTimeout(() => showGhBtn(false), START_DELAY);

function setupTyping(now) {
  typingEl.innerHTML = '';
  typingSpans = TYPING_STRING.split('').map(ch => {
    const span = document.createElement('span');
    span.dataset.target = ch;
    span.dataset.hidden = '0';
    span.textContent = '';
    span.style.opacity = '0';
    typingEl.appendChild(span);
    return span;
  });
  typingState = 'typing';
  currentTypingIndex = 0;
  typingStartTime = now;
  bottomBtn.style.display = 'none';
  hideGhBtn();
}

function updateTyping(now) {
  if (typingState === 'typing') {
    const elapsed = now - typingStartTime;
    const charsToShow = Math.floor(elapsed / 70);
    if (charsToShow > currentTypingIndex && currentTypingIndex < typingSpans.length) {
      currentTypingIndex = charsToShow;
      for (let i = 0; i < currentTypingIndex; i++) {
        typingSpans[i].textContent = typingSpans[i].dataset.target;
        typingSpans[i].style.opacity = '1';
      }
    }
    if (currentTypingIndex >= typingSpans.length) {
      typingState = 'holding';
      typingStartTime = now;
    }
  } else if (typingState === 'holding') {
    if (now - typingStartTime > 1800) {
      typingState = 'crumbling';
      typingStartTime = now;
    }
  } else if (typingState === 'crumbling') {
    const elapsed = now - typingStartTime;
    typingSpans.forEach((span, i) => {
      const delay = i * 25;
      if (elapsed > delay && span.dataset.hidden === '0') {
        span.dataset.hidden = '1';
        span.textContent = randomGlyph();
        span.style.color = '#0a0';
        span.style.opacity = '0';
      }
    });
    const allHidden = typingSpans.every(s => s.dataset.hidden === '1');
    if (allHidden && elapsed > typingSpans.length * 25 + 600) {
      titlePhase = 'between';
      pendingTitleIndex = -1;
      phaseStart = now + 400;
      setTimeout(() => showGhBtn(false), 400);
    }
  }
}

function triggerTvOff() {
  titlePhase = 'tv_collapse';
  collapseStart = performance.now();
  rainActive = false;
  bottomBtn.classList.add('collapsing');
  ghBtn.classList.remove('hot');
  ghBtn.classList.add('collapsing');
  if (btnGlitchInterval) { clearInterval(btnGlitchInterval); btnGlitchInterval = null; }
  drops.forEach(d => { d.collapsing = true; d.vx = 0; d.vy = 0; });
  crumbs.forEach(c => { c.collapsing = true; });
}

function updateCenterTitle(now) {
  if (titlePhase === 'typing_phase') { updateTyping(now); return; }
  if (titlePhase === 'between') {
    if (now >= phaseStart) setupTitle(pendingTitleIndex, now);
    return;
  }
  if (titlePhase === 'tv_collapse' || titlePhase === 'tv_off') return;
  if (now < phaseStart) return;

  if (titlePhase === 'appearing') {
    const t = now - phaseStart;
    if (logoEl && !logoEl.classList.contains('show')) logoEl.classList.add('show');
    letters.forEach((el, i) => {
      if (el.dataset.locked === '1') return;
      const delay = i * LETTER_STEP;
      if (t < delay) return;
      el.classList.add('show');
      el.textContent = randomGlyph();
      if (t > delay + APPEAR_SCRAMBLE_TIME) {
        el.dataset.locked = '1';
        el.textContent = el.dataset.target;
        el.classList.add('locked');
      }
    });
    const allLocked = letters.every(el => el.dataset.locked === '1');
    if (allLocked) {
      titlePhase = 'hold';
      phaseStart = now;
      oracleEl.classList.remove('inactive');
      oracleEl.classList.add('done');
      if (logoEl) logoEl.classList.add('locked');
    }
    return;
  }

  if (titlePhase === 'hold') {
    const holdDuration = currentTitleIndex === -1 ? 7000 : HOLD_TIME;
    if (logoEl) {
      const held = now - phaseStart;
      if (!logoEl.dataset.flashed && held > 900) {
        logoEl.dataset.flashed = '1';
        logoEl.classList.add('true-color');
        const el = logoEl;
        setTimeout(() => el.classList.remove('true-color'), 1400);
      }
      if (Math.random() < 0.008 && !logoEl.classList.contains('glitch')) {
        const el = logoEl;
        el.classList.add('glitch');
        setTimeout(() => el.classList.remove('glitch'), 90 + Math.random() * 80);
      }
    }
    if (currentTitleIndex !== -1) {
      letters.forEach(el => {
        if (el.dataset.locked === '1' && el.dataset.hidden === '0') {
          if (Math.random() < 0.02) {
            const target = el.dataset.target;
            el.textContent = randomGlyph();
            setTimeout(() => {
              if (titlePhase === 'hold' && el.dataset.target === target) el.textContent = target;
            }, 40 + Math.random() * 60);
          }
        }
      });
    } else {
      letters.forEach(el => {
        if (el.dataset.locked === '1') return;
        if (Math.random() < 0.08) {
          const target = el.dataset.target;
          el.textContent = randomGlyph();
          el.style.color = Math.random() > 0.5 ? '#ff00ff' : '#00ffff';
          setTimeout(() => {
            if (titlePhase === 'hold') { el.textContent = target; el.style.color = ''; }
          }, 60);
        }
      });
    }
    if (now - phaseStart > holdDuration) {
      titlePhase = 'disappearing';
      phaseStart = now;
      oracleEl.classList.remove('done', 'onedopea-mode');
      oracleEl.classList.add('inactive');
      if (logoEl) {
        logoEl.classList.remove('locked', 'true-color', 'glitch', 'show');
        logoEl.classList.add('out');
      }
      letters.forEach(el => { if (el.dataset.locked !== '1') el.dataset.hidden = '0'; });
    }
    return;
  }

  if (titlePhase === 'disappearing') {
    const t = now - phaseStart;
    const scrambleTime = currentTitleIndex === -1 ? DISAPPEAR_SCRAMBLE_TIME * 0.8 : DISAPPEAR_SCRAMBLE_TIME;
    letters.forEach((el, i) => {
      if (el.dataset.hidden === '1') return;
      const delay = i * LETTER_STEP;
      if (t < delay) return;
      el.classList.remove('locked');
      el.textContent = randomGlyph();
      if (t > delay + scrambleTime) { el.classList.remove('show'); el.dataset.hidden = '1'; }
    });
    const allHidden = letters.every(el => el.dataset.hidden === '1');
    if (allHidden) {
      if (currentTitleIndex === -1) {
        completedCycles = 0;
        pendingTitleIndex = 0;
        titlePhase = 'between';
        phaseStart = now + BETWEEN_WORDS_TIME;
        rainActive = true;
        cycleFallMultiplier = Math.min(16.0, cycleFallMultiplier * 2);
      } else {
        if (currentTitleIndex === TITLES.length - 1) completedCycles++;
        if (completedCycles >= MAX_CYCLES_BEFORE_TV) {
          triggerTvOff();
        } else {
          pendingTitleIndex = (currentTitleIndex + 1) % TITLES.length;
          titlePhase = 'between';
          phaseStart = now + BETWEEN_WORDS_TIME;
        }
      }
    }
  }
}

function resize() {
  C.width = window.innerWidth;
  C.height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  maxDrops = Math.max(15, Math.floor(C.width / S) * 0.25);
}
resize();
addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

function glyphAt(d, i) {
  return GLYPHS[((d.glyph - i) % GLYPHS.length + GLYPHS.length) % GLYPHS.length];
}

function spawnDrop() {
  drops.push({
    x: Math.floor(Math.random() * (C.width / S)) * S,
    y: -S, startY: -S,
    speed: 1.2 + Math.random() * 2.2,
    glyph: (Math.random() * GLYPHS.length) | 0,
    shattered: false, collapsing: false,
    vx: 0, vy: 0, alpha: 1
  });
}

function shatterDrop(d) {
  d.shattered = true;
  for (let i = 0; i < N; i++) {
    const py = d.y - i * S;
    if (py < -S || py > C.height + S) continue;
    const count = 4 + ((Math.random() * 4) | 0);
    for (let j = 0; j < count; j++) {
      crumbs.push({
        x: d.x + Math.random() * S, y: py + Math.random() * S,
        vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 6 - 1,
        life: 1, decay: 0.012 + Math.random() * 0.02,
        w: 1 + Math.random() * 4, h: 1 + Math.random() * 4,
        isChar: Math.random() < 0.35, ch: glyphAt(d, i),
        chSize: S * (0.28 + Math.random() * 0.5),
        rot: (Math.random() - 0.5) * 4, rotV: (Math.random() - 0.5) * 0.28,
        collapsing: false
      });
    }
  }
}

function updateDrop(d) {
  if (d.collapsing) {
    const cx = C.width / 2, cy = C.height / 2;
    const dx = cx - d.x, dy = cy - d.y;
    const dist = Math.hypot(dx, dy) || 1;
    const elapsed = performance.now() - collapseStart;
    const accel = 0.8 + elapsed / 800;
    d.vx = (d.vx || 0) + (dx / dist) * accel;
    d.vy = (d.vy || 0) + (dy / dist) * accel;
    d.vx *= 0.94; d.vy *= 0.94;
    d.x += d.vx; d.y += d.vy;
    d.alpha = Math.min(1, dist / 100);
    return dist > 15;
  }
  if (!d.shattered && currentTitleIndex !== 2) {
    const sz = getSafeZone();
    if (d.y >= sz.y && d.y <= sz.y + sz.h && d.x >= sz.x && d.x <= sz.x + sz.w) shatterDrop(d);
  }
  if (d.shattered) { d.alpha -= 0.07; return d.alpha > 0; }
  d.y += d.speed;
  d.glyph = (d.glyph + 1) % GLYPHS.length;
  if (d.y - d.startY >= N * S * cycleFallMultiplier) shatterDrop(d);
  return d.y - N * S < C.height + S;
}

function updateCrumb(c) {
  if (c.collapsing) {
    const cx = C.width / 2, cy = C.height / 2;
    const dx = cx - c.x, dy = cy - c.y;
    const dist = Math.hypot(dx, dy) || 1;
    const elapsed = performance.now() - collapseStart;
    const accel = 1.5 + elapsed / 400;
    c.vx += (dx / dist) * accel; c.vy += (dy / dist) * accel;
    c.vx *= 0.92; c.vy *= 0.92;
    c.x += c.vx; c.y += c.vy;
    c.life = Math.min(1, dist / 60);
    return dist > 10;
  }
  c.x += c.vx; c.y += c.vy;
  c.vy += 0.16; c.vx *= 0.985;
  c.rot += c.rotV; c.life -= c.decay;
  return c.life > 0;
}

function drawDrop(d) {
  X.font = S + 'px monospace';
  for (let i = 0; i < N; i++) {
    const py = d.y - i * S;
    if (py < -S || py > C.height) continue;
    const ch = glyphAt(d, i);
    if (i === 0 && !d.shattered) {
      X.shadowColor = '#0F0'; X.shadowBlur = 8;
      X.fillStyle = `rgba(200,255,200,${d.alpha})`;
    } else {
      X.shadowBlur = 0;
      const f = Math.max(0, 1 - i / N);
      const g = (255 * f * d.alpha) | 0;
      X.fillStyle = `rgba(0,${g},0,${d.alpha})`;
    }
    X.fillText(ch, d.x, py);
  }
  X.shadowBlur = 0;
}

function drawCrumb(c) {
  const a = Math.max(0, c.life);
  const g = (220 * a) | 0;
  X.save();
  X.translate(c.x, c.y);
  X.rotate(c.rot);
  if (c.isChar) {
    X.font = c.chSize + 'px monospace';
    X.fillStyle = `rgba(0,${g},40,${a})`;
    X.fillText(c.ch, 0, 0);
  } else {
    X.fillStyle = `rgba(0,${g},30,${a})`;
    X.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
  }
  X.restore();
}

function loop(now) {
  X.fillStyle = '#000';
  X.fillRect(0, 0, C.width, C.height);

  if (rainActive && Math.random() < 0.45 && drops.length < maxDrops) spawnDrop();

  for (let i = drops.length - 1; i >= 0; i--) {
    if (updateDrop(drops[i])) drawDrop(drops[i]);
    else drops.splice(i, 1);
  }
  if (crumbs.length > MAX_CRUMBS) crumbs.splice(0, crumbs.length - MAX_CRUMBS);
  for (let i = crumbs.length - 1; i >= 0; i--) {
    if (updateCrumb(crumbs[i])) drawCrumb(crumbs[i]);
    else crumbs.splice(i, 1);
  }

  if (titlePhase === 'tv_collapse') {
    const allGone = drops.length === 0 && crumbs.length === 0;
    if (allGone || now - collapseStart > 1500) {
      titlePhase = 'tv_off';
      const tvOverlay = document.getElementById('tv-effect');
      tvOverlay.classList.add('active');
      setTimeout(() => {
        tvOverlay.classList.remove('active');
        titlePhase = 'typing_phase';
        setupTyping(performance.now());
      }, 600);
    }
  }

  checkMouseProximity();

  updateCenterTitle(now);
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
