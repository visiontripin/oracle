name: BotControl Windows

on:
  push:
    branches: ["arena/**", "main"]
    paths:
      - "tg-bot-control/desktop-web/**"
      - "tg-bot-control/tools/check-no-tokens.py"
      - ".github/workflows/botcontrol-windows.yml"
  pull_request:
    paths:
      - "tg-bot-control/desktop-web/**"
      - "tg-bot-control/tools/check-no-tokens.py"
      - ".github/workflows/botcontrol-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No live tokens in the tree
        run: python tg-bot-control/tools/check-no-tokens.py
      - name: Test runtime
        working-directory: tg-bot-control/desktop-web
        run: |
          python -m unittest -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test-generated.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build executable
        working-directory: tg-bot-control/desktop-web
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.11.1
          python -m PyInstaller --noconfirm --clean --onefile --name BotControl --add-data "index.html;." --add-data "style.css;." --add-data "app.js;." --add-data "generated.js;." server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test executable
        working-directory: tg-bot-control/desktop-web
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path dist/BotControl.exe) -ArgumentList '--no-browser', '--port', '18765' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if ($process.HasExited) { throw 'BotControl.exe exited unexpectedly' }
              try {
                $page = Invoke-WebRequest -Uri 'http://127.0.0.1:18765/' -UseBasicParsing -TimeoutSec 2
                $js = Invoke-WebRequest -Uri 'http://127.0.0.1:18765/app.js' -UseBasicParsing -TimeoutSec 2
                $generated = Invoke-WebRequest -Uri 'http://127.0.0.1:18765/generated.js' -UseBasicParsing -TimeoutSec 2
                $status = Invoke-RestMethod -Uri 'http://127.0.0.1:18765/api/status' -TimeoutSec 2
                if ($page.Content -match 'BotControl' -and $js.Content -match 'runtimeStatus' -and $generated.Content -match 'GENERATED_PROMPT' -and $status.state -eq 'stopped') { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw 'BotControl.exe did not serve its assets and status' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: BotControl-Windows
          path: tg-bot-control/desktop-web/dist/BotControl.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows preview
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[win]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'botcontrol-windows-preview-0.6.0'
          $exe = 'tg-bot-control/desktop-web/dist/BotControl.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $notes = @(
            'Экспериментальная локальная версия для Windows. Python не требуется: распакуйте архив и откройте BotControl.exe, затем используйте браузер на http://127.0.0.1:8765/. Консольное окно должно оставаться открытым: пока окно работает, бот может отвечать.',
            '',
            'Новое в 0.6.0 (исправления по итогам тестирования): остановка бота занимает до 5 секунд, добавлена кнопка «Перезапустить»; сообщения больше не теряются, если ответ одному пользователю не удался; работают адреса localhost и 127.0.0.1; ошибки показывают реальную причину (токен против интернета); фразы-триггеры срабатывают по целым словам («кот» не срабатывает на «скот»); команда /chatid показывает chat ID для напоминаний; напоминание отрабатывает в окне допуска 10 минут и повторяется при сбое; импорт списков из Android .py отсеивает кадры анимаций и служебные списки и показывает превью; журнал показывает имя сценария.',
            '',
            'Это не полная версия Android: импорт .py ограничен списками, .bc не совместим с Android, callback-кнопки не поддерживаются. Реальный Telegram-бот в CI не проверялся. Файл не подписан — Windows может предупредить при первом запуске.',
            '',
            "SHA-256: $hash"
          ) -join "`n"
          $notes | Set-Content -Encoding utf8 windows-release-notes.txt
          # Тег — коммит с BotControl.exe внутри: файл скачивается
          # git fetch <тег> + git show (как APK в botcontrol-apk.yml).
          Copy-Item $exe 'tg-bot-control/desktop-web/BotControl.exe' -Force
          git add -f tg-bot-control/desktop-web/BotControl.exe
          git -c user.name="botcontrol-ci" -c user.email="botcontrol-ci@users.noreply.github.com" commit --no-verify -m "BotControl.exe 0.6.0 (preview) — из $($env:GITHUB_SHA.Substring(0,7))"
          git tag -f $tag
          git push --force origin "refs/tags/$tag"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
            gh release edit $tag --notes-file windows-release-notes.txt --prerelease
          } else {
            gh release create $tag $exe --prerelease --title 'BotControl для Windows — предварительная версия 0.6.0' --notes-file windows-release-notes.txt
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
